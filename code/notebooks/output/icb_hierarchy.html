als \u203a Industrial Goods and Services \u203a Aerospace and Defense \u203a Defense","Producers of components and equipment for the defense industry, including military aircraft, radar equipment and weapons. Also included are companies that primarily provide services to the defense industry."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electrical Components","Makers and distributors of basic electrical parts for finished products such as radios, televisions and other consumer electronics. Includes makers of cables, wires, ceramics, transistors, and electric adapters. Excludes communications-related equipment, which are classified under Telecommunications Equipment and makers of high-technology parts, which are classified under Electronic Components Subsector."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Control and Filter","Companies primarily  involved in providing mechanical and electronic security and\u002for filtration systems"],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Gauges and Meters","Companies that design, manufacture and market products used to measure electric, gas, water, imaging, and other data for use in a variety of industries."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Pollution Control","Companies primarily engaged in the production of pollution control equipment for purification of air and liquids."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Other","Companies that specialize in the development and production of electrical devices\u002fcomponents marketed to business clients."],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Diversified ustrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Paints and Coatings","Companies that manufacture and distribute paint, material coatings, and resins"],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Plastics","Companies that manufacture and market plastic products or chemicals used to make plastic"],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Glass","Companies that manufacture various structural glasses such as float glass, architectural glass, delicacy glass, automotive glass, and other glass products. Glass containers\u002fbottles prepared for other markets are classified in 50203030 - Containers and Packaging. Specialized glass for application in electronics are classified in 10102015 - Electronic Components."],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Containers and Packaging","Companies that may produces a wide range of packaging products and packaging related materials, including  cartons, plastic bottles, jars, glass bottles,  aluminum cans, dispensing pumps, aerosol valves, etc."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Engineering \u203a Machinery: Industrial","Companies that design, develop, manufacture, sell, and support general industrial machines and parts. This excludes all the other machinery subsectors specified"],["Industrials \u203a Industrial Goods and Services \u203a Industrial Engineering \u203a Machinery: Agricultural","Manufacturers and distributers of a range of farming equipment for irrigation, harvesting, plowing and other processes"],["Industrials \u203a Industrial Goods and Services \u203a Industrial Engineering \u203a Machinery: Construction and Handling","Companies that design, manufacture and market large-size industrial equipment for construction and ports."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Engineering \u203a Machinery: Engines","Companies that manufacture and distribute energy output devices and component parts, including diesel engines and gas engines"],["Industrials \u203a Industrial Goods and Services \u203a Industrial Engineering \u203a Machinery: Tools","Companies that manufactures and market value-adding equipment for various heavy industries"],["Industrials \u203a Industrial Goods and Services \u203a Industrial Engineering \u203a Machinery: Specialty","Companies that design, manufacture and market a specific type or group of industrial machines and parts. This excludes all the other Machinery industries categorized in the Machinery subsector."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Support Services \u203a Industrial Suppliers","Distributors and wholesalers of diversified products and equipment primarily used in the commercial and industrial sectors. Includes builder\u2019s merchants and companies providing  Maintenance\u002fRepair services."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Support Services \u203a Transaction Processing Services","Providers of computerized transaction processing services. Includes companies that engages in any aspects of global payment services such as routing of payment information and related data services that facilitate the authorization, clearing, and settlement of transactions. Includes card network operators, issuer and acquirer processors."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Support Services \u203a Professional Business Support Services","Companies that provide outsourced business operation services. This includes consulting services, corporate taxes, and business decision tools such as credit monitoring and KYC database service. Credit Agencies and Rating firms are classified under the Financial Data Providers Subsector."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Support Services \u203a Business Training and Employment

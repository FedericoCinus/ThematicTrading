inges, springs,   etc."],["Basic Materials \u203a Basic Resources \u203a Industrial Metals and Mining \u203a Aluminum","Companies that mine or process bauxite or manufacture and distribute aluminum bars, rods and other products for use by other industries. Excludes manufacturers of finished aluminum products, such as siding, which are categorized according to the type of end product."],["Basic Materials \u203a Basic Resources \u203a Industrial Metals and Mining \u203a Copper","Companies primarily involved in the mining, extraction and distribution of copper and related minerals"],["Basic Materials \u203a Basic Resources \u203a Industrial Metals and Mining \u203a Nonferrous Metals","Producers and traders of metals and primary metal products other than iron, aluminum and steel. Excludes companies that make finished products, which are categorized according to the type of end product."],["Basic Materials \u203a Basic Resources \u203a Precious Metals and Mining \u203a Diamonds and Gemstones","Companies engaged in the exploration for and production of diamonds and other gemstones."],["Basic Materials \u203a Basic Resources \u203a Precious Metals and Mining \u203a Gold Mining","Prospectors for and extractors or refiners of gold-bearing ores."],["Basic Materials \u203a Basic Resources \u203a Precious Metals and Mining \u203a Platinum and Precious Metals","Companies engaged in the exploration for and production of platinum, silver and other precious metals not defined elsewhere."],["Basic Materials \u203a Chemicals \u203a Chemicals \u203a Chemicals: Diversified","Companies that manufacture and market a diversified range of industrial chemicals"],["Basic Materials \u203a Chemicals \u203a Chemicals \u203a Chemicals and Synthetic Fibers","Companies that manufacture and distribute chemical fibers for various applications"],["Basic Materials \u203a Chemicals \u203a Chemicals \u203a Fertilizers","Companies that manufacture and market nitrogen fertilizers and other agricultural ch ","Companies with principal activities that include operating commercial TV stations and\u002for radio broadcasting"],["Consumer Discretionary \u203a Retail \u203a Retailers \u203a Diversified Retailers","Retail outlets and wholesalers offering a wide variety of products including both hard goods and soft goods."],["Consumer Discretionary \u203a Retail \u203a Retailers \u203a Apparel Retailers","Retailers and wholesalers specializing mainly in clothing, shoes, jewelry, sunglasses and other accessories."],["Consumer Discretionary \u203a Retail \u203a Retailers \u203a Home Improvement Retailers","Retailers and wholesalers concentrating on the sale of home improvement products, including garden equipment, carpets, wallpaper, paint, home furniture, blinds and curtains, and building materials."],["Consumer Discretionary \u203a Retail \u203a Retailers \u203a Specialty Retailers","Retailers and wholesalers concentrating on a single class of goods, such as electronics, books, automotive parts or closeouts. Includes automobile dealerships, duty-free shops and automotive fuel stations not owned by oil companies.  Excludes Apparel and Home Improvement Retailers"],["Consumer Discretionary \u203a Travel and Leisure \u203a Travel and Leisure \u203a Airlines","Companies providing primarily passenger air transport. Excludes airport operators and air freight transport, which are classified under 50206040 - Delivery Services."],["Consumer Discretionary \u203a Travel and Leisure \u203a Travel and Leisure \u203a Travel and Tourism","Companies providing travel and tourism related services, including travel agents, online travel reservation services, and companies that provide passenger transportation for leisure are included, such as tour buses, leisure cruisers and railways, and taxis. Excludes mass public transportation services which are classified under Industrial Transportation Sector."],["Consumer Discretionary \u203a Travel and Leisure \u203a Travel and Leisure \u203a Casinos and Gambling","Providers of gambling and casino facilities. Includes online casinos, racetracks and the manufacturers of pachinko machines and casino and lottery equipment."],["Consumer Discretionary \u203a Travel and Leisure \u203a Travel and Leisure \u203a Hotels and Motels","Operators and managers of hotels, motels, lodges, resorts, spas and campgrounds."],["Consumer Discretionary \u203a Travel and Leisure \u203a Travel and Leisure \u203a Recreational Services","Providers of leisure facilities and services, including fitness centers, amusement parks, concerts and sports\u002fe-sports event promotion. Also includes companies that own and manage professional sports teams."],["Consumer Discretionary \u203a Travel and Leisure \u203a Travel and Leisure \u203a Restaurants and Bars","Operators of restaurants, fast-food facilities, coffee shops and bars. Includes integrated brewery companies.  Excludes catering companies, which are classified as Vending and Catering Service."]],"hovertemplate":"\u003cb\u003e%{customdata[0]}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","legendgroup":"Consumer Discretionary","marker":{"color":"rgb(17, 165, 121)","line":{"color":"#222","width":1.5},"opacity":0.95,"size":13},"mode":"markers","name":"Consumer Discretionary","x":{"dtype":"f4","bdata":"HiuRwDFrjsBc0o\u002fAryuPwATJhcCICYrAyoeKwOQ0kMBQJ5PAv+WJwGTbisC4EVjAYEyEwH3SlMACmI\u002fAfSuHwGAvhcCT1ILAFYqWwG9pk8CRDHzAK7SJwAgXjsCG9ozAqy+HwIOQf8DypIHAU3qmwHwYh8CG7oDAiy+JwCupkMC1PIrAwRPivtPSgsBicJPAGkdvwNxhaMAhNI7A"},"y":{"dtype":"f4","bdata":"5FHtQIX0AEHuDfhAjpT2QAyq8kAd2AlBydjuQGld7kBIaO1A\u002f0DyQL\u002fJ8kBb2QZBuInvQPlz7EBwJ+1AKjz2QBn09kBV9gRB9hH2QIyA9EAJJ\u002fhAh6r4QNyJ7kBxVwdB\u002fpj0QKya8kBt5\u002fJAtWXlQCYY8EAVxQRB63vzQB8e8kC5VvZAaCz+QHpV9kBodxlBuNQMQXypHkF2BRBB"},"type":"scatter"},{"customdata":[["Consumer Staples \u203a Food, Beverage and Tobacco \u203a Beverages \u203a Brewers","Manufacturers and shippers of cider or malt p es primarily engaged in manufacturing and distributing cement and cement-derived products"],["Industrials \u203a Construction and Materials \u203a Construction and Materials \u203a Building Materials: Other","Companies that provide materials to the building and construction industry, excluding air-conditioning, cement, heating, plumbing, roofing, and wall boards"],["Industrials \u203a Industrial Goods and Services \u203a Aerospace and Defense \u203a Aerospace","Manufacturers, assemblers and distributors of aircraft and aircraft parts, including communication satellite,  used in commercial or private air and\u002for space transport."],["Industrials \u203a Industrial Goods and Services \u203a Aerospace and Defense \u203a Defense","Producers of components and equipment for the defense industry, including military aircraft, radar equipment and weapons. Also included are companies that primarily provide services to the defense industry."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electrical Components","Makers and distributors of basic electrical parts for finished products such as radios, televisions and other consumer electronics. Includes makers of cables, wires, ceramics, transistors, and electric adapters. Excludes communications-related equipment, which are classified under Telecommunications Equipment and makers of high-technology parts, which are classified under Electronic Components Subsector."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Control and Filter","Companies primarily  involved in providing mechanical and electronic security and\u002for filtration systems"],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Gauges and Meters","Companies that design, manufacture and market products used to measure electric, gas, water, imaging, and other data for use in a variety of industries."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Pollution Control","Companies primarily engaged in the production of pollution control equipment for purification of air and liquids."],["Industrials \u203a Industrial Goods and Services \u203a Electronic and Electrical Equipment \u203a Electronic Equipment: Other","Companies that specialize in the development and production of electrical devices\u002fcomponents marketed to business clients."],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Diversified Industrials","Companies engaged in three or more industrial business activities, none of which is the dominant business line"],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Paints and Coatings","Companies that manufacture and distribute paint, material coatings, and resins"],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Plastics","Companies that manufacture and market plastic products or chemicals used to make plastic"],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Glass","Companies that manufacture various structural glasses such as float glass, architectural glass, delicacy glass, automotive glass, and other glass products. Glass containers\u002fbottles prepared for other markets are classified in 50203030 - Containers and Packaging. Specialized glass for application in electronics are classified in 10102015 - Electronic Components."],["Industrials \u203a Industrial Goods and Services \u203a General Industrials \u203a Containers and Packaging","Companies that may produces a wide range of packaging products and packaging related materials, including  cartons, plastic bottles, jars, glass bottles,  aluminum cans, dispensing pumps, aerosol valves, etc."],["Industrials \u203a Industrial Goods and Services \u203a  Railroads","Companies that operate railway systems for transporting goods and mass public rail services."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Transportation \u203a Railroad Equipment","Companies that manufacture, supply and distribute railroad supplies"],["Industrials \u203a Industrial Goods and Services \u203a Industrial Transportation \u203a Marine Transportation","Providers of on-water transportation for commercial markets, such as container shipping. Also includes shipbuilders. Excludes ports, which are classified under Transportation Services."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Transportation \u203a Delivery Services","Operators of mail and package delivery services for commercial and consumer use. Includes courier and logistic services primarily involving air transportation."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Transportation \u203a Commercial Vehicle-Equipment Leasing","Companies that rents and lease operational equipment to commercial clients, such as: rails, tankers, freight cars, related equipment plus aviation assets (jets and airplanes)."],["Industrials \u203a Industrial Goods and Services \u203a Industrial Transportation \u203a Transportation Services","Companies providing services to the Industrial Transportation sector, including companies that manage airports, train depots, roads, bridges, tunnels, ports, and providers of logistic services to shippers of goods. Includes companies that provide aircraft and vehicle maintenance services."]],"hovertemplate":"\u003cb\u003e%{customdata[0]}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","legendgroup":"Industrials","marker":{"color":"rgb(230, 131, 16)","line":{"color":"#222","width":1.5},"opacity":0.95,"size":13},"mode":"markers","name":"Industrials","x":{"dtype":"f4","bdata":"8P+KwJeghMB8XY3AgkOUwG9xiMDfC5TAnD2JwKslkcCci5jAGAePwOq4nsAHxZDAoOCQwLZRh
